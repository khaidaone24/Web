<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Đào Thế Khải</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding-top: 50px;
    }

    .contact-box {
      background: white;
      border: 1px solid #ccc;
      padding: 25px 35px;
      width: 400px;
      border-radius: 4px;
    }

    h2 {
      margin-top: 0;
      font-size: 1.2em;
      font-weight: bold;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      display: block;
      font-size: 0.9em;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 0.9em;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > div {
      flex: 1;
    }

    textarea {
      resize: vertical;
      height: 100px;
    }

    button {
      background-color: #800040;
      color: white;
      border: none;
      border-radius: 3px;
      padding: 8px 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #a10055;
    }
  </style>
</head>
<body>
  <div class="contact-box">
    <h2>Contact the editorial office</h2>
    <form action="result.html" method="get">
      <div>
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" name="fullname">
      </div>

      <!-- Email và Send to cùng hàng -->
      <div class="row">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email">
        </div>
        <div>
          <label for="sendto">Send to</label>
          <select id="sendto" name="sendto">
            <option>Editorial board</option>
            <option>News Department</option>
            <option>Board of Perspectives</option>
            <option>World Board</option>
            <option>Business Department</option>
          </select>
        </div>
      </div>

      <div>
        <label for="title">Title</label>
        <input type="text" id="title" name="title">
      </div>

      <div>
        <label for="content">Content</label>
        <textarea id="content" name="content"></textarea>
      </div>

      <div>
        <button type="submit">Send</button>
      </div>
    </form>
  </div>
</body>
</html>
