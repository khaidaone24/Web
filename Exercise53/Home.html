<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 53: Product - Đào Thế Khải</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding-top: 50px;
    }

    .container {
      border: 1px solid black;
      padding: 15px 25px;
      width: 650px;
      background-color: #fff;
    }

    h2 {
      margin: 0 0 10px 0;
      font-size: 1.2em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid black;
    }

    th, td {
      border: 1px solid black;
      padding: 6px 8px;
      font-size: 0.9em;
    }

    th {
      background-color: #f3f3f3;
      text-align: left;
    }

    input[type="text"] {
      width: 95%;
      padding: 4px;
      border: 1px solid #ccc;
      border-radius: 2px;
      text-align: right;
    }

    .total-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 10px;
      gap: 5px;
    }

    .total-row label {
      font-weight: bold;
    }

    .total-row input[type="text"] {
      width: 120px;
      padding: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #ffcc00;
      border: 1px solid #bfa100;
      padding: 7px 20px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 2px;
    }

    button:hover {
      background-color: #ffd633;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>List of products</h2>
    <form action="result.html" method="get">
      <table>
        <tr>
          <th>Part Number</th>
          <th>Description</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Item table</th>
        </tr>
        <tr>
          <td>C112</td>
          <td>Mouse</td>
          <td>19.95$</td>
          <td><input type="text" name="qty1" id="qty1"></td>
          <td><input type="text" name="item1" id="item1" readonly></td>
        </tr>
        <tr>
          <td>B124</td>
          <td>Keyboard US</td>
          <td>29.95$</td>
          <td><input type="text" name="qty2" id="qty2"></td>
          <td><input type="text" name="item2" id="item2" readonly></td>
        </tr>
        <tr>
          <td>U125</td>
          <td>USB KingMax</td>
          <td>39.95$</td>
          <td><input type="text" name="qty3" id="qty3"></td>
          <td><input type="text" name="item3" id="item3" readonly></td>
        </tr>
      </table>
      <hr>

      <div class="total-row">
        <label for="total">Total:</label>
        <input type="text" id="total" name="total" readonly>
        <button type="submit">Sum</button>
      </div>
    </form>
  </div>

  <script>
    const prices = [19.95, 29.95, 39.95];

    function updateTotals() {
      const qty1 = parseFloat(document.getElementById('qty1').value) || 0;
      const qty2 = parseFloat(document.getElementById('qty2').value) || 0;
      const qty3 = parseFloat(document.getElementById('qty3').value) || 0;

      const item1 = qty1 * prices[0];
      const item2 = qty2 * prices[1];
      const item3 = qty3 * prices[2];

      document.getElementById('item1').value = item1 ? item1.toFixed(2) + '$' : '';
      document.getElementById('item2').value = item2 ? item2.toFixed(2) + '$' : '';
      document.getElementById('item3').value = item3 ? item3.toFixed(2) + '$' : '';

      const total = item1 + item2 + item3;
      document.getElementById('total').value = total ? total.toFixed(2) + '$' : '';
    }

    ['qty1', 'qty2', 'qty3'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateTotals);
    });
  </script>
</body>
</html>
