<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home_Đào Thế Khải</title>
        <script>
        window.onload = function() {
        document.getElementById("input_data").disabled = true;
        }
        function enterData() {
            const inputField = document.getElementById("input_data");
            inputField.disabled = false;
            inputField.focus(); 
            document.getElementById("result_data").value = "";
        }

        function countUppercase() {
            const text = document.getElementById("input_data").value;
            const count = (text.match(/[A-Z]/g) || []).length;
            document.getElementById("result_data").value = "Uppercase letters: " + count;
        }

        function uppercaseDisplay() {
            const text = document.getElementById("input_data").value;
            document.getElementById("result_data").value = text.toUpperCase();
        }

        function lowercaseDisplay() {
            const text = document.getElementById("input_data").value;
            document.getElementById("result_data").value = text.toLowerCase();
        }

        function oneWordPerLine() {
            const text = document.getElementById("input_data").value;
            document.getElementById("result_data").value = text.split(/\s+/).join("\n");
        }

        function wordCount() {
            const text = document.getElementById("input_data").value;
            const count = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
            document.getElementById("result_data").value = "Word count: " + count;
        }

        function countLowercase() {
            const text = document.getElementById("input_data").value;
            const count = (text.match(/[a-z]/g) || []).length;
            document.getElementById("result_data").value = "Lowercase letters: " + count;
        }

        function printVowelsConsonants() {
            const text = document.getElementById("input_data").value.toLowerCase();
            const vowels = text.match(/[aeiou]/g) || [];
            const consonants = text.match(/[bcdfghjklmnpqrstvwxyz]/g) || [];
            document.getElementById("result_data").value = 
                "Vowels: " + vowels.join("") + "\nConsonants: " + consonants.join("");
        }

        function openW3C() {
            window.open("https://www.w3schools.com/js/js_string_methods.asp", "_blank");
        }
        
    </script>
    <style>
        button{
            width: 100%;
        }
        textarea{
            width: 100%;
        }
    </style>
</head>
<body>
    <h2>Using String Processing Functions</h2>
    <form>
        <table>
            <tr>
                <td>
                    <b>Input Data:</b><br>
                    <textarea id="input_data"></textarea>
                </td>
                <td>
                    <b>Result:</b><br>
                    <textarea id="result_data"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <button type="button" onclick="enterData()">Enter Data</button>
                </td>
                <td>
                    <button type="button" onclick="countUppercase()">Count the number of uppercase characters</button>
                </td>
            </tr>
            <tr>
                <td>
                    <button type="button" onclick="uppercaseDisplay()">Uppercase display</button>
                </td>
                <td>
                    <button type="button" onclick="oneWordPerLine()">Output one word per line</button>
                </td>
            </tr>
            <tr>
                <td>
                    <button type="button" onclick="lowercaseDisplay()">lowercase display</button>
                </td>
                <td>
                    <button type="button" onclick="wordCount()">Word count</button>
                </td>
            </tr>
            <tr>
                <td>
                    <button type="button" onclick="countLowercase()">Count the number of lowercase characters</button>
                </td>
                <td>
                    <button type="button" onclick="printVowelsConsonants()">Print vowels, consonants</button>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="button" onclick="openW3C()">W3C's String Processing Website</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
