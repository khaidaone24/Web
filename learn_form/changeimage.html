<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Change image - Đào Thế Khải</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        function hide_image() {
            document.getElementById("avatar").style.display = "none";
        }
        function show_image() {
            document.getElementById("avatar").style.display = "block";
        }
    </script>
</head>
<body>
    <form>
        <input type="radio" name="myimage" id="img1" onchange="show_image()"/>
        <label for="img1">Show Image</label>
        <br/>
        <input type="radio" name="myimage" id="img2" onchange="hide_image()"/>
        <label for="img2">Hide Image</label>
        <br/>
        <img src="images/redscarft_girl.jpg" id="avatar" style="display: block; width:200px; margin-top:10px;"/>
    </form>
</body>
</html>
