<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index, </title>
    <script>
        function process_string() {
            str=my_form.input_string.value;
            p1=str.indexOf(";");
            p2=str.lastIndexOf(";");
            //alert(p1);
            //alert(p2);
            out=str.substring(p1,p2);
            alert(out);
            out_name=str.substring(p1+1,p2);
            td_name.innerText=out_name;
            out_id=str.substring(0,p1);
            td_id.innerText=out_id;
            out_price=str.substring(p2+1);
            td_price.innerText=out_price;
        }
    </script>
</head>
<body>
    <form name="my_form">
        <table>
            <tr>
                <td> Input String</td>
                <td>
                    <input type="text" id="input_string" size="50">
                </td>
            </tr>
            <tr>
                <td>&nbsp</td>
                <td>
                    <button type="button" onclick="process_string()">Process</button>
                </td>
            </tr>
            <tr>
                <td>ID</td>
                <td id="td_id"></td>
            </tr>
            <tr>
                <td>NAME</td>
                <td id="td_name"></td>
            <tr>
                <td>PRICE</td>
                <td id="td_price"></td>
            </tr>
        </table>
    </form>
</body>
</html>
